
name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'URJA_KENDRA_Android_Server_Assessment_v1.5/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: URJA_KENDRA_Android_Server_Assessment_v1.5
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urja-kendra-debug-apk
          path: URJA_KENDRA_Android_Server_Assessment_v1.5/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
