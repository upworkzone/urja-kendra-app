
name: Build Android APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

     
      - name: Install Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project files
        run: |
          pwd
          ls -la
          find . -maxdepth 6 \( -name build.gradle -o -name build.gradle.kts \)

      - name: Build debug APK
        working-directory: URJA_KENDRA_Android_Server_Assessment_v1.5
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urja-kendra-debug-apk
          path: URJA_KENDRA_Android_Server_Assessment_v1.5/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
