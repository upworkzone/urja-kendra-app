services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////data/urja_dev.db
      AUTH_SECRET_KEY: local-docker-development-secret-change-before-deployment
      OTP_TTL_SECONDS: "300"
      OTP_MAX_ATTEMPTS: "5"
      OTP_PROVIDER: stub
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - urja_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  urja_data:
